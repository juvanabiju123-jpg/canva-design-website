
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Studio | Digital Designs</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fffaf7;
      color: #352b35;
      line-height: 1.6;
    }

    header {
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      border-bottom: 1px solid #f1e6ed;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #a35c85;
    }

    nav a {
      text-decoration: none;
      color: #554654;
      margin-left: 18px;
    }

    .hero {
      text-align: center;
      padding: 65px 20px;
      background: linear-gradient(135deg, #fce4ec, #eee5ff);
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.2;
      margin-bottom: 18px;
    }

    .hero p {
      margin-bottom: 25px;
      color: #665766;
    }

    .button {
      display: inline-block;
      background: #a35c85;
      color: white;
      padding: 12px 22px;
      border: none;
      border-radius: 25px;
      text-decoration: none;
      cursor: pointer;
      font-size: 15px;
    }

    .section {
      padding: 45px 7%;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 30px;
    }

    .tools {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    input, select {
      padding: 12px;
      border: 1px solid #e4d5df;
      border-radius: 10px;
      background: white;
      font-size: 15px;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .card {
      background: white;
      border: 1px solid #f0e4eb;
      border-radius: 16px;
      overflow: hidden;
      padding-bottom: 20px;
      box-shadow: 0 5px 18px #4a24410c;
    }

    .preview {
      height: 190px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      font-size: 25px;
      font-weight: bold;
      color: #59415b;
    }

    .pink { background: #f8dce8; }
    .purple { background: #e8dcff; }
    .yellow { background: #fff0c9; }
    .green { background: #dceee2; }

    .card h3, .card p, .card .price, .card button {
      margin-left: 18px;
      margin-right: 18px;
    }

    .card h3 {
      margin-top: 15px;
      font-size: 19px;
    }

    .card p {
      color: #756a75;
      font-size: 14px;
      margin-top: 5px;
    }

    .price {
      display: block;
      font-weight: bold;
      font-size: 20px;
      margin-top: 12px;
      margin-bottom: 15px;
    }

    .card button {
      width: calc(100% - 36px);
    }

    #cart {
      background: #f6edf3;
      border-radius: 15px;
      padding: 22px;
      margin-top: 35px;
      text-align: center;
    }

    #cart p {
      margin: 8px 0 15px;
    }

    footer {
      padding: 25px;
      text-align: center;
      background: white;
      color: #756a75;
      border-top: 1px solid #f1e6ed;
    }

    @media (max-width: 500px) {
      header {
        justify-content: center;
      }

      nav a {
        margin: 0 8px;
      }

      .section {
        padding: 35px 5%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Pastel Studio ♡</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#shop">Shop</a>
      <a href="#cart">Cart (<span id="cartCount">0</span>)</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h1>Little Designs,<br>Big Ideas ♡</h1>
    <p>Beautiful digital templates to make your life more creative.</p>
    <a href="#shop" class="button">Explore the collection</a>
  </section>

  <section class="section" id="shop">
    <h2>Our Digital Collection</h2>

    <div class="tools">
      <input
        type="search"
        id="search"
        placeholder="Search designs..."
        aria-label="Search designs"
      >

      <select id="category" aria-label="Filter by category">
        <option value="all">All categories</option>
        <option value="Social Media">Social Media</option>
        <option value="Planner">Planners</option>
        <option value="Invitation">Invitations</option>
        <option value="Presentation">Presentations</option>
      </select>
    </div>

    <div class="products" id="products"></div>

    <div id="cart">
      <h2>Your Cart 🛍️</h2>
      <div id="cartItems">Your cart is empty.</div>
      <p>Total: <strong id="total">₹0</strong></p>
      <button class="button" onclick="checkout()">
        Continue to checkout
      </button>
    </div>
  </section>

  <footer>
    <p>© 2026 Pastel Studio. All rights reserved.</p>
    <p>Digital designs made with love ♡</p>
  </footer>

  <script>
    // EDIT THESE PRODUCTS TO ADD YOUR OWN DESIGNS
    const products = [
      {
        id: 1,
        name: "Instagram Templates",
        category: "Social Media",
        price: 149,
        color: "pink",
        preview: "SOCIAL<br>MEDIA KIT"
      },
      {
        id: 2,
        name: "Daily Planner",
        category: "Planner",
        price: 99,
        color: "purple",
        preview: "MY DAILY<br>PLANNER"
      },
      {
        id: 3,
        name: "Birthday Invitation",
        category: "Invitation",
        price: 129,
        color: "yellow",
        preview: "YOU'RE<br>INVITED!"
      },
      {
        id: 4,
        name: "Presentation Kit",
        category: "Presentation",
        price: 199,
        color: "green",
        preview: "PRESENT<br>YOUR IDEAS"
      }
    ];

    let cart = [];

    function renderProducts() {
      const search = document
        .getElementById("search").value.toLowerCase();

      const category = document.getElementById("category").value;

      const filtered = products.filter(product =>
        product.name.toLowerCase().includes(search) &&
        (category === "all" || product.category === category)
      );

      const container = document.getElementById("products");

      if (filtered.length === 0) {
        container.innerHTML = "<p>No designs found.</p>";
        return;
      }

      container.innerHTML = filtered.map(product => `
        <article class="card">
          <div class="preview ${product.color}">
            <span>${product.preview}</span>
          </div>
          <h3>${product.name}</h3>
          <p>${product.category} · Digital product</p>
          <span class="price">₹${product.price}</span>
          <button class="button"
            onclick="addToCart(${product.id})">
            Add to cart
          </button>
        </article>
      `).join("");
    }

    function addToCart(id) {
      const product = products.find(item => item.id === id);
      cart.push(product);
      renderCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function renderCart() {
      document.getElementById("cartCount").textContent = cart.length;

      const container = document.getElementById("cartItems");

      if (cart.length === 0) {
        container.textContent = "Your cart is empty.";
      } else {
        container.innerHTML = cart.map((item, index) => `
          <p>
            ${item.name} — ₹${item.price}
            <button onclick="removeFromCart(${index})">
              Remove
            </button>
          </p>
        `).join("");
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById("total").textContent = "₹" + total;
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Please add a design to your cart first!");
        return;
      }

      alert(
        "Your cart is ready! This is a demo store. " +
        "Online payment and automatic delivery must be " +
        "connected before accepting real orders."
      );
    }

    document.getElementById("search")
      .addEventListener("input", renderProducts);

    document.getElementById("category")
      .addEventListener("change", renderProducts);

    renderProducts();
  </script>

</body>
</html>
